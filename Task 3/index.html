<!DOCTYPE html>
<html>
<head>
    <title>Interactive Events Demo</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        input {
            padding: 5px;
            margin: 5px 0;
        }
        button {
            padding: 8px 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2>Interactive Events Demo</h2>
<h3>A) Key Press Validation (onkeyup)</h3>
Name:
<input type="text" id="name"><br>
Email:
<input type="text" id="email"><br>
<h3>B) Mouse Hover Highlight</h3>
Message:
<input type="text" id="message">
<h3>C) Double Click Confirmation</h3>
<button id="submitBtn">Submit</button>
<script src="script.js"></script>
</body>
</html>
